<form class="search-form header-search" role="search" action="/catalogue.html" data-search-form>
  <div class="search search--compact">
    <label class="sr-only" for="header-search" data-i18n="search.label">Rechercher un produit</label>
    <div class="search__box">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <input class="search__input" id="header-search" type="search" name="q" placeholder="Rechercher…" data-i18n-placeholder="search.placeholder" enterkeyhint="search" spellcheck="false">
      <button class="search__clear" type="button" data-search-clear aria-label="Effacer" data-i18n-aria="search.clear" hidden><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
  </div>
</form>
