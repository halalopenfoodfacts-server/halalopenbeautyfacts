## ─────────────────────────────────────────────────────────────────────────────
## Halal Open Beauty Facts — nginx de production (/etc/nginx/sites-available/)
## Installé par deploy.sh. Les tests E2E lisent les en-têtes de sécurité de ce
## fichier (core/tools/serve.mjs) : une page qui viole la CSP fait échouer les tests.
## ─────────────────────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=halal_api_beauty:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=halal_web_beauty:10m rate=40r/s;

server {
    server_name halalopenbeautyfacts.org www.halalopenbeautyfacts.org;

    root /var/www/halalopenbeautyfacts;
    index index.html;
    server_tokens off;
    charset utf-8;

    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

    set $cors_origin "";
    if ($http_origin ~* ^https://(www\.)?halalopenbeautyfacts\.org$) {
        set $cors_origin $http_origin;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/xml text/plain;

    # Script inline autorisé par empreinte (thème avant affichage) : pas de 'unsafe-inline' pour les scripts.
    # Le build (core/tools/build.mjs) échoue si l'empreinte ne correspond plus.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-9dR12zXuhR7MHNJfvfnV84p+jI++Xim6rPC5DDh60Pc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.openbeautyfacts.org https://static.openbeautyfacts.org https://images.openfoodfacts.org; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; frame-src https://halal-open-food-facts.s2.yapla.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html { internal; expires -1; }
    location = /50x.html { internal; expires -1; }

    # ── Fichiers versionnés (nom contenant un hash) : cache d'un an ──
    location ^~ /assets/js/     { expires 1y; access_log off; try_files $uri =404; }
    location ^~ /assets/css/    { expires 1y; access_log off; try_files $uri =404; }
    location ^~ /assets/fonts/  { expires 1y; access_log off; try_files $uri =404; }
    location ^~ /assets/vendor/ { expires 1y; access_log off; try_files $uri =404; }
    location ^~ /assets/images/ { expires 30d; access_log off; try_files $uri =404; }
    location ^~ /icons/         { expires 30d; access_log off; try_files $uri =404; }
    location = /service-worker.js { expires -1; try_files $uri =404; }
    location = /manifest.webmanifest { expires 1d; default_type application/manifest+json; try_files $uri =404; }

    # ── Robots malveillants ──
    location ~* /(wp-admin|wp-login|xmlrpc\.php|phpmyadmin|adminer|cgi-bin|actuator|\.git|\.env) { return 404; }
    location ~* \.(php|phtml|asp|aspx|jsp|cgi|pl|py|rb|sh|sql|bak|old|orig|swp|ini|log|conf|key|pem|yml|yaml)$ { return 404; }
    location ~ /\.(?!well-known/acme-challenge/) { return 404; }

    # ── Pages : site multi-pages, une URL inconnue renvoie une vraie 404 ──
    location / {
        limit_req zone=halal_web_beauty burst=60 nodelay;
        expires -1;
        try_files $uri $uri.html $uri/ =404;
    }

    # ── API Django (127.0.0.1:8000) ──
    location /proxy/v2/ {
        limit_req zone=halal_api_beauty burst=40 nodelay;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Vary "Origin" always;
            return 204;
        }
        proxy_pass http://127.0.0.1:8000/api/v2/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_set_header Host $host;
        proxy_set_header X-Portal beauty;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /proxy/search/ {
        limit_req zone=halal_api_beauty burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000/api/search/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_set_header Host $host;
        proxy_set_header X-Portal beauty;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
    }

    location /proxy/facets/ {
        limit_req zone=halal_api_beauty burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000/api/facets/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_set_header Host $host;
        proxy_set_header X-Portal beauty;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
    }

    location = /proxy/stats {
        limit_req zone=halal_api_beauty burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000/api/stats?portal=beauty;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = /proxy/top {
        limit_req zone=halal_api_beauty burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000/api/top?portal=beauty&$args;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = /proxy/recent {
        limit_req zone=halal_api_beauty burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000/api/recent?portal=beauty&$args;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Toute autre route /proxy/* : 404 JSON (avant : index.html servi en 200)
    location /proxy/ {
        default_type application/json;
        return 404 '{"error":"not found"}';
    }

    access_log /var/log/nginx/halalopenbeautyfacts_access.log;
    error_log  /var/log/nginx/halalopenbeautyfacts_error.log;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/halalopenbeautyfacts.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/halalopenbeautyfacts.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.halalopenbeautyfacts.org) { return 301 https://$host$request_uri; }
    if ($host = halalopenbeautyfacts.org)     { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name halalopenbeautyfacts.org www.halalopenbeautyfacts.org;
    return 404;
}
