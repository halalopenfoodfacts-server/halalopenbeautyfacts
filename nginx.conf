## Halal Open Beauty Facts — nginx du conteneur de développement (docker compose, port 8090).
## Sert dist/ (npm run build). La configuration de production est dans deploy/nginx/.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    error_page 404 /404.html;
    location ^~ /assets/ { expires 7d; try_files $uri =404; }
    location = /service-worker.js { expires -1; }
    location / { expires -1; try_files $uri $uri.html $uri/ =404; }

    location /proxy/v2/     { proxy_pass http://django:8000/api/v2/;     proxy_set_header X-Portal beauty; proxy_read_timeout 30s; }
    location /proxy/search/ { proxy_pass http://django:8000/api/search/; proxy_set_header X-Portal beauty; proxy_read_timeout 30s; }
    location /proxy/facets/ { proxy_pass http://django:8000/api/facets/; proxy_set_header X-Portal beauty; proxy_read_timeout 30s; }
    location = /proxy/stats  { proxy_pass http://django:8000/api/stats?portal=beauty; }
    location = /proxy/top    { proxy_pass http://django:8000/api/top?portal=beauty&$args; }
    location = /proxy/recent { proxy_pass http://django:8000/api/recent?portal=beauty&$args; }
    location /proxy/ { default_type application/json; return 404 '{"error":"not found"}'; }
}
