  {{> search-hero}}
  <div class="cluster" style="justify-content:center">
    <a class="btn btn--primary" href="/"><svg aria-hidden="true"><use href="#i-home"/></svg><span>Accueil</span></a>
    <a class="btn" href="/catalogue.html"><svg aria-hidden="true"><use href="#i-grid"/></svg><span>Catalogue</span></a>
    <button class="btn" type="button" data-scan><svg aria-hidden="true"><use href="#i-scan"/></svg><span>Scanner</span></button>
  </div>
</section>
